<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 288 64" width="288" height="64">
  <defs>
    <!-- 紫蓝渐变 -->
    <linearGradient id="pulseGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#9333EA"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
  </defs>

  <!-- ========== 心电图脉冲图标（左） ========== -->
  <polyline points="8,32 22,32 29,13 40,52 48,32 60,32 67,10 78,52 84,32 90,32" 
            fill="none" 
            stroke="url(#pulseGradient)" 
            stroke-width="4.5" 
            stroke-linecap="round" 
            stroke-linejoin="round"/>
  
  <!-- 脉冲末端圆点 -->
  <circle cx="90" cy="32" r="5" fill="#2563EB"/>

  <!-- ========== 品牌文字（右） ========== -->
  <text x="108" y="43" 
        font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" 
        font-size="28" 
        font-weight="700"
        letter-spacing="-0.3">
    <tspan fill="#1E293B">Skill</tspan><tspan fill="#2563EB">Pulse</tspan>
  </text>
</svg>